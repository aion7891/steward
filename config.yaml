# Steward main configuration file.
# Copy .env.example to .env for API keys and local overrides.

app:
  name: "Steward"
  version: "0.10.0"
  environment: "development"
  log_level: "INFO"
  log_file: "steward.log"
  log_max_bytes: 5242880
  log_backup_count: 3

paths:
  data_dir: "data"
  db_path: "data/steward.db"
  vector_store_dir: "chroma"
  okf_dir: "knowledge"
  recycle_dir: "data/recycle"
  reports_dir: "reports"
  logs_dir: "data/logs"
  host_inventory_file: "host-inventory/apps.json"

scanner:
  watched_folders:
    - "~/Documents"
    - "~/Downloads"
    - "~/Desktop"
  downloads_folder: "~/Downloads"
  ignored_dirs:
    - ".git"
    - ".venv"
    - "venv"
    - "node_modules"
    - "__pycache__"
    - ".DS_Store"
  ignored_extensions:
    - ".tmp"
    - ".part"
    - ".crdownload"
  large_file_mb: 100
  stale_days: 90
  debounce_seconds: 0.5

models:
  # Supported providers: ollama, openai, anthropic, gemini
  provider: "ollama"
  model_id: "gemma4"  # must support tool calling (gemma3:4b does not)
  host: "http://localhost:11434"
  temperature: 0.2
  embedding_provider: "ollama"
  embedding_model: "nomic-embed-text"
  embedding_dimensions: 768

rag:
  collection_name: "documents"
  chunk_size: 800
  chunk_overlap: 120
  max_file_chars: 100000
  max_read_mb: 20
  default_top_k: 5
  sensitive_patterns:
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - "id_rsa*"
    - "*password*"
    - "*secret*"
    - "*credentials*"

safety:
  # Safety defaults: never delete directly and dry-run by default.
  dry_run: true
  require_confirmation: true
  move_to_recycle_first: true
  recycle_retention_days: 30
  protected_paths:
    - "/System"
    - "/usr"
    - "/etc"
    - "~/Work/Clients"

scheduler:
  scan_interval_minutes: 60
  cleanup_interval_hours: 24
  report_day: "sunday"

server:
  host: "127.0.0.1"
  port: 7777
  ui_port: 8501
