[project]
name = "steward"
version = "0.13.0"
description = "Local-first AI assistant for organizing files, storage, and computer activity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "watchdog>=6.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "agno>=3.2.1",
    "ollama>=0.6.3",
    "chromadb>=1.5.9",
    "openai>=3.60.0",
    "networkx>=3.6.1",
    "sqlalchemy>=2.1.9",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "fastapi>=0.165.0",
    "streamlit>=1.67.0",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
steward = "steward.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["steward*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
