# nginx config for the Steward web UI container.
# - serves the built React app (with SPA fallback so /scan?job=... survives a refresh)
# - forwards /steward/* to the steward-api container, so the browser talks to ONE origin

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS; re-resolve steward-api if its container restarts with a new IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers: only this site's own scripts may run; no framing by other sites
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Note: an add_header inside a location would DROP the security headers above,
    # so the blocks below use default_type/expires instead.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API calls go to the Steward API container
    location /steward/ {
        set $steward_api http://steward-api:7777;
        proxy_pass $steward_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Local models can take a minute or more to answer a chat question
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Built files have content hashes in their names, so they can be cached for a long time
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app (always re-check index.html)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
