# Steward Docker Compose configuration (4 services, localhost-only port bindings).
# Before starting, optionally export host apps:
#   uv run python scripts/export_host_inventory.py

services:
  ollama:
    image: ollama/ollama:latest
    container_name: steward-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  steward-api:
    build: .
    container_name: steward-api
    command: ["python", "-m", "steward.api"]
    env_file:
      - path: .env
        required: false
    environment:
      - STEWARD_CONFIG_PATH=/app/config.docker.yaml
      - STEWARD_API_HOST=0.0.0.0
      - STEWARD_API_PORT=7777
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - ${STEWARD_DOCUMENTS_DIR:-~/Documents}:/data/Documents:ro
      - ${STEWARD_DESKTOP_DIR:-~/Desktop}:/data/Desktop:ro
      - ${STEWARD_DOWNLOADS_DIR:-~/Downloads}:/data/Downloads
      - ./knowledge:/app/knowledge
      - ./data:/app/data
      - ./chroma:/app/chroma
      - ./reports:/app/reports
      - ./host-inventory:/app/host-inventory:ro
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7777/steward/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  steward-worker:
    build: .
    container_name: steward-worker
    command: ["python", "-m", "steward.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - STEWARD_CONFIG_PATH=/app/config.docker.yaml
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ${STEWARD_DOCUMENTS_DIR:-~/Documents}:/data/Documents:ro
      - ${STEWARD_DESKTOP_DIR:-~/Desktop}:/data/Desktop:ro
      - ${STEWARD_DOWNLOADS_DIR:-~/Downloads}:/data/Downloads
      - ./knowledge:/app/knowledge
      - ./data:/app/data
      - ./chroma:/app/chroma
      - ./reports:/app/reports
      - ./host-inventory:/app/host-inventory:ro
    depends_on:
      steward-api:
        condition: service_healthy
    restart: unless-stopped

  steward-ui:
    build: .
    container_name: steward-ui
    command:
      [
        "streamlit",
        "run",
        "steward/ui.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    environment:
      - STEWARD_API_URL=http://steward-api:7777
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./reports:/app/reports:ro
    depends_on:
      steward-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
